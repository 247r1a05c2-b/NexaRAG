name: NexaRAG CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: pip install pytest
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m pytest -q
