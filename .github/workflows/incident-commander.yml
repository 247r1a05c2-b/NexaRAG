name: Incident Commander CI
on:
  push:
    branches: [main, feature/multi-agent-incident-commander]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall backend tests
      - run: pytest -q
