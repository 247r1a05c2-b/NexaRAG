apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexarag-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexarag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexarag
  template:
    metadata:
      labels:
        app: nexarag
    spec:
      containers:
        - name: nexarag
          image: your-registry/nexarag:latest
          ports:
            - containerPort: 8501
          envFrom:
            - secretRef:
                name: nexarag-secrets
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nexarag-data
---
apiVersion: v1
kind: Service
metadata:
  name: nexarag
spec:
  selector:
    app: nexarag
  ports:
    - port: 80
      targetPort: 8501
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexarag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexarag
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
